name: Check and package plugin
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - name: Verify version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs"
          const manifest = JSON.parse(fs.readFileSync("plugin.json", "utf8"))
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          if (manifest.version !== pkg.version) throw new Error("plugin.json and package.json versions must match")
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${manifest.version}`) throw new Error("Tag must match the plugin version")
          if (!fs.readFileSync("RELEASE_NOTES.md", "utf8").trim()) throw new Error("Write release notes before packaging")
          JS
      - run: npm run pack:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: |
            dist/*.eidos-plugin
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.eidos-plugin dist/*.sha256 --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
